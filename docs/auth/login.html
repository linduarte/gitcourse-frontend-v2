<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Git Course</title>

  <link rel="stylesheet" href="../assets/css/gitcourse.css">
</head>

<body class="auth-page">

<main class="container login-box" style="max-width:400px; margin:50px auto;">
  <h1 style="text-align:center; color: #3b82f6;">Git Course</h1>

  <div class="card shadow-lg">
    <h2 style="text-align:center; margin-bottom: 20px;">Entrar no Cockpit</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email" class="sr-only">E-mail</label>
        <input id="email"
               type="email"
               placeholder="Seu e-mail cadastrado"
               autocomplete="username"
               required
               autofocus
               class="form-input">
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label for="password" class="sr-only">Senha</label>
        <input id="password"
               type="password"
               placeholder="Sua senha"
               autocomplete="current-password"
               required
               class="form-input">
      </div>

      <button type="submit" id="btn-entrar" class="btn-primary" style="width: 100%; margin-top: 20px;">
        Entrar
      </button>

      <p id="loginMessage"
         style="text-align:center; margin-top:10px; font-size: 0.9rem; min-height: 1.2em;"
         aria-live="polite"></p>
    </form>

    <p style="text-align:center; margin-top:20px; font-size: 0.95rem; color: #6b7280;">
      Ainda não tem conta?
      <a href="register.html" style="color: #3b82f6; font-weight: 600;">Registre-se agora</a>
    </p>

  </div>
</main>

<script type="module" src="../assets/config.js?v=2026-05-19-v9"></script>
<script type="module" src="../assets/js/login.js?v=2026-05-19-v9"></script>

</body>
</html>
